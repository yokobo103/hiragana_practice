name: Browser tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - name: Start the app
        run: |
          python -m http.server 8143 --directory app &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8143/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run desktop browser tests
        run: npm test
      - name: Run mobile browser tests
        run: npm run test:mobile
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: |
            work/qa/
            work/qa-mobile/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
